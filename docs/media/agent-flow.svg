<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="400" viewBox="0 0 1520 400" role="img" aria-labelledby="title desc">
<title id="title">Agent 执行闭环</title>
<desc id="desc">Agent 的文字输出不是成功依据</desc>
<style>
