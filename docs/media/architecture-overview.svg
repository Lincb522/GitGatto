<rect class="panel-accent" x="1255" y="584" width="250" height="92" rx="16"/><text class="label" x="1380.0" y="620.0" text-anchor="middle"><tspan x="1380.0" dy="0">Homebrew</tspan></text><text class="detail" x="1380.0" y="644.0" text-anchor="middle"><tspan x="1380.0" dy="0">开发工具与运行库</tspan></text>
