<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1130" viewBox="0 0 1520 1130" role="img" aria-labelledby="title desc">
<title id="title">GitGatto 系统架构</title>
<desc id="desc">前后台进程、监控任务交接、灾备、应用交互、存储与外部服务。</desc>
<style>
    :root { color-scheme: light dark; }
    .bg { fill: #ffffff; }
    .panel { fill: #f7f9fa; stroke: #dce2e6; stroke-width: 1.5; }
    .panel-accent { fill: #fff5ef; stroke: #efb092; stroke-width: 1.5; }
    .panel-green { fill: #edf8f4; stroke: #86c7b7; stroke-width: 1.5; }
    .panel-blue { fill: #eef5fb; stroke: #91b9da; stroke-width: 1.5; }
    .panel-purple { fill: #f5f0fb; stroke: #b7a0d4; stroke-width: 1.5; }
    .panel-muted { fill: #f2f4f5; stroke: #bfc7cd; stroke-width: 1.5; stroke-dasharray: 7 6; }
    .lane { fill: #fbfcfc; stroke: #e3e7ea; stroke-width: 1.5; }
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .title { fill: #17202a; font-size: 28px; font-weight: 700; }
    .section { fill: #17202a; font-size: 17px; font-weight: 700; }
    .label { fill: #25313b; font-size: 15px; font-weight: 650; }
    .detail { fill: #687580; font-size: 13px; font-weight: 500; }
    .badge { fill: #e85d24; font-size: 12px; font-weight: 700; }
    .connector { fill: none; stroke: #8b979f; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .connector-accent { fill: none; stroke: #e85d24; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .dot { fill: #e85d24; }
    @media (prefers-color-scheme: dark) {
        .bg { fill: #101419; }
        .panel, .lane { fill: #171d23; stroke: #303943; }
        .panel-accent { fill: #2b1d17; stroke: #8f4d31; }
        .panel-green { fill: #14251f; stroke: #397d6c; }
        .panel-blue { fill: #16232e; stroke: #477da9; }
        .panel-purple { fill: #211b2a; stroke: #72599a; }
        .panel-muted { fill: #151a1f; stroke: #53606a; }
        .title, .section, .label { fill: #f2f5f7; }
        .detail { fill: #a2adb6; }
        .connector { stroke: #66737d; }
    }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b979f"/>
  </marker>
</defs>
<rect class="bg" x="0" y="0" width="1520" height="1130" rx="24"/>
<text class="title" x="64" y="58">GitGatto 系统架构</text>
<text class="detail" x="64" y="84">主程序与系统后台助手分别运行；监控和灾备由一个持有者执行</text>
<rect class="panel-blue" x="160" y="126" width="500" height="112" rx="16"/><text class="label" x="410.0" y="172.0" text-anchor="middle"><tspan x="410.0" dy="0">GitGatto 主程序</tspan></text><text class="detail" x="410.0" y="196.0" text-anchor="middle"><tspan x="410.0" dy="0">SwiftUI · AppKit · WebKit</tspan><tspan x="410.0" dy="18">界面状态与用户操作</tspan></text>
<rect class="panel-purple" x="860" y="126" width="500" height="112" rx="16"/><text class="label" x="1110.0" y="172.0" text-anchor="middle"><tspan x="1110.0" dy="0">GitGattoMonitor 后台助手</tspan></text><text class="detail" x="1110.0" y="196.0" text-anchor="middle"><tspan x="1110.0" dy="0">SMAppService · LaunchAgent</tspan><tspan x="1110.0" dy="18">主程序退出后接手已开启的监控与灾备</tspan></text>
<path class="connector" d="M410 246 L590 290" marker-end="url(#arrow)"/>
<path class="connector" d="M1110 246 L930 290" marker-end="url(#arrow)"/>
<rect class="panel-accent" x="340" y="298" width="840" height="100" rx="16"/><text class="label" x="760.0" y="338.0" text-anchor="middle"><tspan x="760.0" dy="0">监控任务所有权</tspan></text><text class="detail" x="760.0" y="362.0" text-anchor="middle"><tspan x="760.0" dy="0">foreground.lock / runtime.lock</tspan><tspan x="760.0" dy="18">交接时先取消并等待旧任务结束，再释放运行锁</tspan></text>
<text class="section" x="64" y="450">主程序运行或后台接手时持续执行</text>
<rect class="panel-green" x="64" y="478" width="318" height="132" rx="16"/><text class="label" x="223.0" y="534.0" text-anchor="middle"><tspan x="223.0" dy="0">仓库变化与活动</tspan></text><text class="detail" x="223.0" y="558.0" text-anchor="middle"><tspan x="223.0" dy="0">文件事件合并 · 增量刷新</tspan><tspan x="223.0" dy="18">Git 状态 · 活动点阵</tspan></text>
<rect class="panel-green" x="422" y="478" width="318" height="132" rx="16"/><text class="label" x="581.0" y="534.0" text-anchor="middle"><tspan x="581.0" dy="0">灾备与仓库守卫</tspan></text><text class="detail" x="581.0" y="558.0" text-anchor="middle"><tspan x="581.0" dy="0">定时 · 重大改动 · 外部异常</tspan><tspan x="581.0" dy="18">内容落盘 → 完成标记 → 三份轮换</tspan></text>
<rect class="panel-green" x="780" y="478" width="318" height="132" rx="16"/><text class="label" x="939.0" y="534.0" text-anchor="middle"><tspan x="939.0" dy="0">远端与 Actions</tspan></text><text class="detail" x="939.0" y="558.0" text-anchor="middle"><tspan x="939.0" dy="0">上游状态 · 检查结果</tspan><tspan x="939.0" dy="18">按已开启通道读取</tspan></text>
<rect class="panel-green" x="1138" y="478" width="318" height="132" rx="16"/><text class="label" x="1297.0" y="534.0" text-anchor="middle"><tspan x="1297.0" dy="0">目标状态</tspan></text><text class="detail" x="1297.0" y="558.0" text-anchor="middle"><tspan x="1297.0" dy="0">读取待完成条件</tspan><tspan x="1297.0" dy="18">发布与安装仍需单独确认</tspan></text>
<path class="connector" d="M760 406 V462 H223 V470 M760 462 H581 V470 M760 462 H939 V470 M939 462 H1297 V470"/>
<text class="section" x="64" y="680">主程序中的交互功能</text>
<rect class="panel-blue" x="64" y="708" width="318" height="132" rx="16"/><text class="label" x="223.0" y="764.0" text-anchor="middle"><tspan x="223.0" dy="0">Git / GitHub</tspan></text><text class="detail" x="223.0" y="788.0" text-anchor="middle"><tspan x="223.0" dy="0">工作区 · PR · Issue · 历史</tspan><tspan x="223.0" dy="18">GitCommandRunner · GitHubService</tspan></text>
<rect class="panel-blue" x="422" y="708" width="318" height="132" rx="16"/><text class="label" x="581.0" y="764.0" text-anchor="middle"><tspan x="581.0" dy="0">目标 / 编排 / 回归</tspan></text><text class="detail" x="581.0" y="788.0" text-anchor="middle"><tspan x="581.0" dy="0">交付条件 · Hunk 分组提交</tspan><tspan x="581.0" dy="18">独立 worktree · git bisect</tspan></text>
<rect class="panel-blue" x="780" y="708" width="318" height="132" rx="16"/><text class="label" x="939.0" y="764.0" text-anchor="middle"><tspan x="939.0" dy="0">Agent 执行通道</tspan></text><text class="detail" x="939.0" y="788.0" text-anchor="middle"><tspan x="939.0" dy="0">项目 · 翻译 · 搜索 · 安装</tspan><tspan x="939.0" dy="18">CLI / OpenAI 兼容 API / DeepSeek</tspan></text>
<rect class="panel-blue" x="1138" y="708" width="318" height="132" rx="16"/><text class="label" x="1297.0" y="764.0" text-anchor="middle"><tspan x="1297.0" dy="0">应用与开发工具</tspan></text><text class="detail" x="1297.0" y="788.0" text-anchor="middle"><tspan x="1297.0" dy="0">下载 · 安装 · 配置 · 验证</tspan><tspan x="1297.0" dy="18">三路队列 · Homebrew 写入串行</tspan></text>
<text class="section" x="64" y="902">系统、存储与发布边界</text>
<rect class="panel" x="64" y="930" width="438" height="124" rx="16"/><text class="label" x="283.0" y="982.0" text-anchor="middle"><tspan x="283.0" dy="0">本地数据</tspan></text><text class="detail" x="283.0" y="1006.0" text-anchor="middle"><tspan x="283.0" dy="0">Git 仓库 · Git bundle · 未提交文件</tspan><tspan x="283.0" dy="18">目标 · 记录 · 译文 · 三份恢复点</tspan></text>
<rect class="panel" x="541" y="930" width="438" height="124" rx="16"/><text class="label" x="760.0" y="982.0" text-anchor="middle"><tspan x="760.0" dy="0">网络与凭据</tspan></text><text class="detail" x="760.0" y="1006.0" text-anchor="middle"><tspan x="760.0" dy="0">GitHub / CLI / 配置的模型服务</tspan><tspan x="760.0" dy="18">API 密钥存系统钥匙串</tspan></text>
<rect class="panel" x="1018" y="930" width="438" height="124" rx="16"/><text class="label" x="1237.0" y="982.0" text-anchor="middle"><tspan x="1237.0" dy="0">版本更新</tspan></text><text class="detail" x="1237.0" y="1006.0" text-anchor="middle"><tspan x="1237.0" dy="0">Sparkle · Developer ID · EdDSA</tspan><tspan x="1237.0" dy="18">Appcast · DMG · 公证单独申请</tspan></text>
</svg>
