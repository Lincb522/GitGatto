name: Release macOS DMG

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CODESIGN_IDENTITY: "Developer ID Application: chengbo lin (7VJKFX4HF8)"
      MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Validate release inputs
        shell: zsh {0}
        run: |
          set -euo pipefail
          for variable in MACOS_DEVELOPER_ID_P12_BASE64; do
            if [[ -z "${(P)variable:-}" ]]; then
              print -u2 "Missing GitHub Actions secret: $variable"
              exit 1
            fi
          done

          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ '^[0-9]+\.[0-9]+\.[0-9]+$' ]]; then
            print -u2 "Release tags must use vMajor.Minor.Patch."
            exit 1
          fi

          BUILD_NUMBER="$(python3 -c 'import sys; major, minor, patch = map(int, sys.argv[1].split(".")); print(major * 1_000_000 + minor * 1_000 + patch)' "$VERSION")"
          print "VERSION=$VERSION" >> "$GITHUB_ENV"
          print "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        shell: zsh {0}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id-application.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/gitgatto-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"

          print -n "$MACOS_DEVELOPER_ID_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          chmod 600 "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "GitGattoActions" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F "$CODESIGN_IDENTITY"

      - name: Test
        run: swift test

      - name: Build and sign application
        shell: zsh {0}
        run: |
          set -euo pipefail
          GITGATTO_VERSION="$VERSION" \
          GITGATTO_BUILD_NUMBER="$BUILD_NUMBER" \
          GITGATTO_CODESIGN_IDENTITY="$CODESIGN_IDENTITY" \
            ./scripts/package-macos.sh

      - name: Create release DMG
        shell: zsh {0}
        run: |
          set -euo pipefail
          mkdir -p dist/releases
          GITGATTO_CODESIGN_IDENTITY="$CODESIGN_IDENTITY" \
            ./scripts/create-dmg.sh \
              "$PWD/dist/GitGatto.app" \
              "$PWD/dist/releases/GitGatto-$VERSION.dmg"

      - name: Generate update feed
        shell: zsh {0}
        run: |
          set -euo pipefail
          RELEASE_DIR="$PWD/dist/releases"
          NOTES="$RELEASE_DIR/GitGatto-$VERSION.md"
          cp Sources/GitGatto/Resources/zh-Hans.lproj/ReleaseNotes.md "$NOTES"

          APPCAST_TOOL="$(find .build/artifacts/sparkle/Sparkle/bin -type f -name generate_appcast -perm +111 -print -quit)"
          [[ -x "$APPCAST_TOOL" ]]
          "$APPCAST_TOOL" \
            --embed-release-notes \
            --maximum-versions 1 \
            --download-url-prefix "https://github.com/Lincb522/GitGatto/releases/download/$GITHUB_REF_NAME/" \
            --full-release-notes-url "https://github.com/Lincb522/GitGatto/releases" \
            -o "$RELEASE_DIR/appcast.xml" \
            "$RELEASE_DIR"

          grep -F "GitGatto-$VERSION.dmg" "$RELEASE_DIR/appcast.xml"
          (
            cd "$RELEASE_DIR"
            shasum -a 256 \
              "GitGatto-$VERSION.dmg" \
              appcast.xml \
              > SHA256SUMS
          )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: zsh {0}
        run: |
          set -euo pipefail
          RELEASE_DIR="$PWD/dist/releases"
          NOTES="$RELEASE_DIR/GitGatto-$VERSION.md"
          ASSETS=(
            "$RELEASE_DIR/GitGatto-$VERSION.dmg"
            "$RELEASE_DIR/appcast.xml"
            "$NOTES"
            "$RELEASE_DIR/SHA256SUMS"
          )

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "GitGatto $VERSION" \
              --notes-file "$NOTES" \
              --latest
            gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" \
              --title "GitGatto $VERSION" \
              --notes-file "$NOTES" \
              --latest
          fi

      - name: Remove temporary signing keychain
        if: always()
        shell: zsh {0}
        run: security delete-keychain "$RUNNER_TEMP/gitgatto-signing.keychain-db" 2>/dev/null || true
