name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "Assets/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "Assets/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            .build/artifacts
            .build/checkouts
            .build/repositories
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-

      - name: Configure Git identity for repository tests
        run: |
          git config --global user.name "GitGatto CI"
          git config --global user.email "ci@gitgatto.dev"
          git config --global init.defaultBranch main

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build
        run: swift build --build-tests

      - name: Test
        timeout-minutes: 10
        run: |
          mkdir -p "$RUNNER_TEMP/test-diagnostics"
          (
            sleep 120
            ps -axo pid,ppid,etime,state,command > "$RUNNER_TEMP/test-diagnostics/processes.txt"
            for pid in $(pgrep -f 'swiftpm-testing-helper.*GitGattoPackageTests|GitGattoPackageTests.xctest/Contents/MacOS/GitGattoPackageTests'); do
              sample "$pid" 3 -file "$RUNNER_TEMP/test-diagnostics/sample-$pid.txt" || true
            done
          ) &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          set -o pipefail
          swift test --skip-build 2>&1 | tee "$RUNNER_TEMP/test-diagnostics/tests.log"

      - name: Test Agent lanes with a constrained executor
        timeout-minutes: 2
        run: |
          set -o pipefail
          LIBDISPATCH_COOPERATIVE_POOL_STRICT=1 swift test --skip-build --filter IndependentAILaneTests \
            2>&1 | tee "$RUNNER_TEMP/test-diagnostics/agent-lanes.log"

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: ${{ runner.temp }}/test-diagnostics
          retention-days: 7

      - name: Package ad-hoc signed app
        run: ./scripts/package-macos.sh "$RUNNER_TEMP/dist"
