name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "Assets/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "Assets/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            .build/artifacts
            .build/checkouts
            .build/repositories
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-

      - name: Configure Git identity for repository tests
        run: |
          git config --global user.name "GitGatto CI"
          git config --global user.email "ci@gitgatto.dev"
          git config --global init.defaultBranch main

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --skip-build

      - name: Package ad-hoc signed app
        run: ./scripts/package-macos.sh "$RUNNER_TEMP/dist"
