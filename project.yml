name: GitGatto
options:
  bundleIdPrefix: dev.gitgatto
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.0"
  groupSortPosition: top
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
  Alamofire:
    url: https://github.com/Alamofire/Alamofire
    exactVersion: 5.12.0
fileGroups:
  - Assets
  - Config
  - docs
  - scripts
  - CHANGELOG.md
  - CONTRIBUTING.md
  - DESIGN.md
  - LICENSE
  - Package.resolved
  - Package.swift
  - PRODUCT.md
  - README.md
  - SECURITY.md
  - THIRD_PARTY_NOTICES.md
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CLANG_ENABLE_MODULES: YES
    DEVELOPMENT_LANGUAGE: en
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO
    MARKETING_VERSION: 0.18.35
    CURRENT_PROJECT_VERSION: 18035
targets:
  GitGatto:
    type: application
    platform: macOS
    sources:
      - path: Sources/GitGatto
        excludes:
          - Resources
          - .DS_Store
      - path: Sources/GitGatto/Resources
        excludes:
          - LanguageIcons
        buildPhase: resources
      - path: Sources/GitGatto/Resources/LanguageIcons
        type: folder
        buildPhase: resources
    postBuildScripts:
      - name: Embed background monitoring helper
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/scripts/embed-monitor-helper.sh
          - $(SRCROOT)/Config/dev.gitgatto.monitor.agent.plist
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LoginItems/GitGattoMonitor.app
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchAgents/dev.gitgatto.monitor.agent.plist
        script: |
          GITGATTO_CODESIGN_IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:--}" \
            "$SRCROOT/scripts/embed-monitor-helper.sh" "$TARGET_BUILD_DIR/$FULL_PRODUCT_NAME"
    dependencies:
      - package: Sparkle
        product: Sparkle
      - package: Alamofire
        product: Alamofire
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gitgatto.client
        PRODUCT_NAME: GitGatto
        PRODUCT_MODULE_NAME: GitGatto
        INFOPLIST_FILE: Config/GitGatto-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Config/GitGatto.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
        Release:
          ONLY_ACTIVE_ARCH: NO
  GitGattoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/GitGattoTests
    dependencies:
      - target: GitGatto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gitgatto.client.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  GitGatto:
    build:
      targets:
        GitGatto: all
        GitGattoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GitGattoTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
